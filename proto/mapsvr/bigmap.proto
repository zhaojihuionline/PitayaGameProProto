syntax = "proto3";

package mapsvr;
option go_package = "pitaya-game/protos/protobuf/pb/golang/mapsvr";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
// 导入公共类型
import "common/types/types.proto";
import "common/errors/errors.proto";

message Position {
  int32 x = 1;
  int32 y = 2;
}

message Size {
  int32 w = 1;
  int32 h = 2;
}

message EnterMapRequest {
  int32 layer = 1;
  // 视野中心点格子的左下角坐标
  Position position = 2;
  // 1.5屏幕格子数
  Size size = 3;
}
message EnterMapResponse {
  types.CommonResp resp = 1;
}

message MoveViewRequest {
  int32 layer = 1;
  Position center = 2;
  Size size = 3;
}
message MoveViewResponse {
  types.CommonResp resp = 1;
}

message LeaveMapRequest {
}
message LeaveMapResponse {
  types.CommonResp resp = 1;
}

// ------------------- Entity ------------------
message Entity {
  int32 id = 1;
  int32 config_id = 2;
  int32 type = 3;
  int32 sub_type = 4;
  repeated google.protobuf.Any data = 5;
  Position pos = 6;
  int64 version = 7;
  int32 gridId = 8;
}

// ------------------- Component ------------------

message EntityStatus {
  bool IsTarget = 1;
}

message BornTime {
  google.protobuf.Timestamp time = 1;
}

message LowHealthTime {
  google.protobuf.Timestamp time = 1;
}

message DeadTime {
  google.protobuf.Timestamp time = 1;
}

// OwnerID 城市归属玩家 ID 组件
message OwnerID {
  string player_id = 1;
}

// ResourceAmount 资源点存量组件
message ResourceAmount {
  int32 item_id = 1;
  int64 total = 2;
  int64 remaining = 3;
}

// GatherOccupant 采集占用者组件
message GatherOccupant {
  int64 march_id = 1;
  string player_id = 2;
}

// ------------------- Grid ------------------

message Grid {
  int32 id = 1;
  Position pos = 2;
  int64 version = 5;
  int32 entityId = 6;
}

message AOISnapshotNotify {
  int32 layer = 1;              // 所属层级 (1~5)
  Position pos = 2;             // 该层的分区索引坐标
  repeated Entity entities = 3; // 全量实体列表
  int64 timestamp = 4;
}

message AOIDeltaNotify {
  int32 layer = 1;              // 所属层级 (1~5)
  Position pos = 2;             // 该层的分区索引坐标
  repeated Entity entities = 3; // 增量新增或更新实体列表
  repeated int32 removed_ids = 4; // 增量中的实体移除ID列表
  int64 timestamp = 5;
}
