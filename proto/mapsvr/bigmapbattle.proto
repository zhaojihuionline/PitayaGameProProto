syntax = "proto3";

package mapsvr;
option go_package = "pitaya-game/protos/protobuf/pb/golang/mapsvr";

import "common/types/types.proto";

message BattleRequest {

}

// FighterInfo 单个战斗方（攻方/守方）的战斗结果信息。
message FighterInfo {
  string  player_id     = 1; // 玩家 ID（怪物/NPC 可约定为系统标识）
  int32   x             = 2; // 战斗发生时该战斗方所在的地图 X 坐标
  int32   y             = 3; // 战斗发生时该战斗方所在的地图 Y 坐标
  int32   soldier_count = 4; // 部队总数（参战人数）
  int32   survived      = 5; // 生还
  int32   light_wound   = 6; // 轻伤
  int32   wounded       = 7; // 受伤（医院可收治）
  int32   heavy_wound   = 8; // 重伤
  map<int32, int32> troop_kill_count_map = 9; // 击杀统计：key=兵种(或兵种+等级约定)，value=击杀数量
}

message BattleResponse {
  types.CommonResp resp = 1;
  FighterInfo attacker = 2;
  FighterInfo defencer = 3;
}
